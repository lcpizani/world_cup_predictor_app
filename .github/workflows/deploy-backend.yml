name: Deploy Backend

on:
  push:
    branches: [dev]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

env:
  REGION: ${{ secrets.GCP_REGION }}
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/worldcup-images/backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build -f backend/Dockerfile \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Run Alembic migrations
        run: |
          # Update image on existing job, or create it on first deploy.
          # DATABASE_URL must be set manually on this job via:
          #   gcloud run jobs update migrate --set-env-vars="DATABASE_URL=..."
          # (see DEPLOYMENT.md Phase 6 for instructions)
          gcloud run jobs update migrate \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} || \
          gcloud run jobs create migrate \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --service-account=backend-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --command=alembic \
            --args=upgrade,head
          gcloud run jobs execute migrate --region=${{ env.REGION }} --wait

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy backend \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --service-account=backend-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --update-env-vars=ENVIRONMENT=production,ALLOW_ADMIN_MATCH_UPDATES=false \
            --allow-unauthenticated \
            --port=8080
